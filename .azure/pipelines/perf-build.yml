#
# perf-build.yml
#
# Azure DevOps pipeline that builds every commit on `main` (and any other
# branches listed in the trigger) and uploads per-RID ASP.NET Core runtime
# packs to the Build Cache Service (BCS) so that dotnet/crank can resolve
# Microsoft.AspNetCore.App runtime binaries by commit SHA for
# performance-regression bisection.
#
# Modeled on dotnet/runtime's `eng/pipelines/performance/perf-build.yml`,
# but with two key behavioural differences (see the perf-build plan in the
# session-state notes for the full rationale):
#
#   * No RegisterBuild stage. `buildInfo.json` is written inline at the
#     end of each per-config UploadArtifacts job, only after the matching
#     archive has been HEAD-verified at the static-website URL. This
#     enforces the BCS atomicity rule: never publish a `buildInfo.json`
#     for a (sha, configKey) before its archive is GET-able.
#
#   * All UploadArtifacts jobs run with `continueOnError: false` (the
#     default). The MissingBuildsTrigger Azure Function only indexes
#     Azure DevOps builds with overall Status == Succeeded; any single
#     upload failure marks the overall build PartiallySucceeded and the
#     Function skips the entire build. Operator retries the whole build
#     green. The atomic unit for indexing is the AzDO build, not the
#     per-config job.
#
# Output layout in BCS:
#
#   builds/aspnetcore/buildArtifacts/{sha}/{configKey}/{archiveFile}
#   builds/aspnetcore/buildArtifacts/{sha}/{configKey}/buildInfo.json
#
# Archive contents (lowercase directory names are a load-bearing contract
# — the future aspnetcore-overlay crank PR will FindDirectory on exactly
# `microsoft.aspnetcore.app.runtime.{rid}`):
#
#   microsoft.aspnetcore.app.runtime.{rid}/
#     Release/
#       runtimes/{rid}/
#         lib/net{X}.0/Microsoft.AspNetCore.*.dll
#         native/aspnetcorev2*.dll       (Windows only — ANCM/IIS bits)
#

# Build every individual commit (no batching). The MissingBuildsTrigger
# Azure Function then indexes succeeded builds into
# builds/aspnetcore/latest/{branch}/latestBuilds.json on its 8h tick.
trigger:
  batch: false
  branches:
    include:
    - main

# No PR validation in v1. This pipeline only produces meaningful output
# under internal+IndividualCI (real commits to mirrored branches). PR
# triggering is left for a follow-up once the security model around the
# `.NET Performance` service connection is settled.
pr: none

parameters:
- name: headRetryCount
  displayName: 'HEAD-verify: maximum attempts per upload'
  type: number
  default: 6
- name: headRetryDelaySeconds
  displayName: 'HEAD-verify: delay (seconds) between attempts'
  type: number
  default: 10

variables:
- name: _TeamName
  value: AspNetCore

# Build Cache Service (BCS) coordinates. The static-website endpoint
# (`z22.web.core.windows.net`) is the read path crank uses, and is fronted
# by a CDN — see the HEAD-verify loop in jobs/perf-build-upload-job.yml.
- name: _aspNetCoreBcsBaseUrl
  value: https://pvscmdupload.z22.web.core.windows.net
- name: _aspNetCoreBcsAccountName
  value: pvscmdupload
- name: _aspNetCoreBcsContainer
  value: '$web'
- name: _aspNetCoreBcsRepoName
  value: aspnetcore
- name: _aspNetCoreBcsSubscription
  value: '.NET Performance (790c4451-dad9-4fda-af8b-10bd9ca328fa)'

# Build-script arguments mirrored from ci.yml. We deliberately omit
# anything related to signing, installers, helix, or maestro publishing
# because none of those contribute to the per-RID runtime pack we ship to
# BCS.
- name: _BuildArgs
  value: /p:TeamName=$(_TeamName)
         /p:OfficialBuildId=$(Build.BuildNumber)
         /p:SkipTestBuild=true
- name: _InternalRuntimeDownloadArgs
  value: -RuntimeSourceFeed https://ci.dot.net/internal
         -RuntimeSourceFeedKey $(dotnetbuilds-internal-container-read-token-base64)
         /p:DotNetAssetRootAccessTokenSuffix='$(dotnetbuilds-internal-container-read-token-base64)'

- template: /eng/common/templates-official/variables/pool-providers.yml@self

resources:
  repositories:
  - repository: 1esPipelines
    type: git
    name: 1ESPipelineTemplates/1ESPipelineTemplates
    ref: refs/tags/release

extends:
  template: v1/1ES.Official.PipelineTemplate.yml@1esPipelines
  parameters:
    settings:
      networkIsolationPolicy: Permissive,CFSClean2
    sdl:
      sourceAnalysisPool:
        name: NetCore1ESPool-Svc-Internal
        image: windows.vs2022.amd64
        os: windows
      spotBugs:
        enabled: false
      policheck:
        enabled: true
      tsa:
        enabled: true

    stages:
    - stage: build
      displayName: Build
      jobs:

      # =====================================================================
      # Windows multi-arch build job
      #
      # Mirrors ci.yml's Windows_build pattern: build.cmd is invoked three
      # times in a single agent — x64 first (with native), then x86 and
      # arm64 with -noBuildNative because they cross-pack against the x64
      # native bits. Each invocation emits its own per-RID
      # Microsoft.AspNetCore.App.Runtime.win-{arch}.{ver}.nupkg into the
      # shared artifacts/packages/Release/Shipping/ directory.
      #
      # The afterBuild step then unpacks each nupkg into the lowercase
      # directory layout the future aspnetcore-overlay crank PR expects.
      # =====================================================================
      - template: .azure/pipelines/jobs/default-build.yml@self
        parameters:
          jobName: Windows_build
          jobDisplayName: 'Build: Windows x64/x86/arm64 (perf-build)'
          agentOs: Windows
          installNodeJs: false

          steps:
          - script: ./eng/build.cmd
                    -ci
                    -prepareMachine
                    -nativeToolsOnMachine
                    -arch x64
                    -pack
                    -all
                    -noBuildJava
                    /p:OnlyPackPlatformSpecificPackages=true
                    $(_BuildArgs)
                    $(_InternalRuntimeDownloadArgs)
                    /bl:artifacts/log/Release/Build.x64.binlog
            env:
              MSBUILDUSESERVER: "1"
            displayName: Build x64

          - script: ./eng/build.cmd
                    -ci
                    -prepareMachine
                    -arch x86
                    -pack
                    -all
                    -noBuildJava
                    -noBuildNative
                    /p:OnlyPackPlatformSpecificPackages=true
                    $(_BuildArgs)
                    $(_InternalRuntimeDownloadArgs)
                    -ExcludeCIBinaryLog
            env:
              MSBUILDUSESERVER: "1"
            displayName: Build x86

          - script: ./eng/build.cmd
                    -ci
                    -prepareMachine
                    -arch arm64
                    -pack
                    -noBuildJava
                    -noBuildNative
                    /p:OnlyPackPlatformSpecificPackages=true
                    $(_BuildArgs)
                    $(_InternalRuntimeDownloadArgs)
                    /bl:artifacts/log/Release/Build.arm64.binlog
            env:
              MSBUILDUSESERVER: "1"
            displayName: Build ARM64

          afterBuild:
          - powershell: |
              $ErrorActionPreference = 'Stop'

              $shippingDir = Join-Path $env:BUILD_SOURCESDIRECTORY 'artifacts/packages/Release/Shipping'
              $stagingRoot = Join-Path $env:BUILD_ARTIFACTSTAGINGDIRECTORY 'bcs'

              # Map: RID -> {os, arch, archive base name}.
              $rids = @(
                  @{ rid='win-x64';   os='windows'; arch='x64';   },
                  @{ rid='win-x86';   os='windows'; arch='x86';   },
                  @{ rid='win-arm64'; os='windows'; arch='arm64'; }
              )

              foreach ($cfg in $rids) {
                  $rid  = $cfg.rid
                  $os   = $cfg.os
                  $arch = $cfg.arch
                  $configKey = "aspnetcore_${arch}_${os}"
                  $artifactName = "BuildArtifacts_${os}_${arch}_Release_aspnetcore"
                  $archiveFile = "${artifactName}.zip"

                  Write-Host ""
                  Write-Host "=== Packing $configKey (rid=$rid) ==="

                  $pattern = "Microsoft.AspNetCore.App.Runtime.$rid.*.nupkg"
                  $nupkg = Get-ChildItem -Path $shippingDir -Filter $pattern -File -ErrorAction SilentlyContinue |
                           Where-Object { $_.Name -notmatch '\.symbols\.nupkg$' } |
                           Sort-Object Name |
                           Select-Object -First 1
                  if (-not $nupkg) {
                      throw "Could not find runtime pack nupkg matching '$pattern' under '$shippingDir'."
                  }
                  Write-Host "Found nupkg: $($nupkg.FullName)"

                  # microsoft.aspnetcore.app.runtime.{rid}/Release/  <-- archive root (lowercase!)
                  $stageDir = Join-Path $stagingRoot $artifactName
                  $payloadDir = Join-Path $stageDir "microsoft.aspnetcore.app.runtime.$rid"
                  $releaseDir = Join-Path $payloadDir 'Release'
                  New-Item -ItemType Directory -Force -Path $releaseDir | Out-Null

                  # Extract the nupkg (it's a zip) into Release/.
                  Expand-Archive -LiteralPath $nupkg.FullName -DestinationPath $releaseDir -Force

                  $runtimesDir = Join-Path $releaseDir "runtimes/$rid"
                  if (-not (Test-Path $runtimesDir)) {
                      throw "Extracted runtime pack is missing expected directory '$runtimesDir'."
                  }

                  # Sanity-check that managed assemblies landed where we expect.
                  $libMatches = Get-ChildItem -Path (Join-Path $runtimesDir 'lib') -Recurse -Filter 'Microsoft.AspNetCore.*.dll' -ErrorAction SilentlyContinue
                  if (-not $libMatches -or $libMatches.Count -eq 0) {
                      throw "Extracted runtime pack for $rid is missing managed Microsoft.AspNetCore.*.dll under 'runtimes/$rid/lib'."
                  }
                  Write-Host "Validated managed lib dir contains $($libMatches.Count) Microsoft.AspNetCore.*.dll(s)."

                  # Defensive: strip debug-symbol files that occasionally tag along.
                  Get-ChildItem -Path $runtimesDir -Recurse -Include '*.pdb','*.dbg' -ErrorAction SilentlyContinue |
                      ForEach-Object { Remove-Item -LiteralPath $_.FullName -Force }

                  # Zip the lowercase root directory (so the archive contents start
                  # with `microsoft.aspnetcore.app.runtime.{rid}/...`).
                  $archivePath = Join-Path $stageDir $archiveFile
                  if (Test-Path $archivePath) { Remove-Item -LiteralPath $archivePath -Force }
                  Compress-Archive -Path $payloadDir -DestinationPath $archivePath -CompressionLevel Optimal -Force

                  # Assert the archive root matches the load-bearing contract.
                  Add-Type -AssemblyName System.IO.Compression.FileSystem
                  $zip = [System.IO.Compression.ZipFile]::OpenRead($archivePath)
                  try {
                      $expectedRoot = "microsoft.aspnetcore.app.runtime.$rid/"
                      $rootEntries = $zip.Entries | ForEach-Object { ($_.FullName -split '/')[0] } | Sort-Object -Unique
                      if ($rootEntries.Count -ne 1 -or "$($rootEntries[0])/" -ne $expectedRoot) {
                          throw "Archive '$archivePath' has root entries [$($rootEntries -join ', ')] but expected exactly '$expectedRoot' (load-bearing contract for future crank PR)."
                      }
                  } finally {
                      $zip.Dispose()
                  }

                  # Drop the working payload directory so only the archive ends up in the published pipeline artifact.
                  Remove-Item -LiteralPath $payloadDir -Recurse -Force

                  $size = (Get-Item $archivePath).Length
                  Write-Host "Produced archive: $archivePath ($size bytes)"
              }
            displayName: 'Pack BCS archives (win-x64 / win-x86 / win-arm64)'

          artifacts:
          - name: BuildArtifacts_windows_x64_Release_aspnetcore
            path: $(Build.ArtifactStagingDirectory)/bcs/BuildArtifacts_windows_x64_Release_aspnetcore
          - name: BuildArtifacts_windows_x86_Release_aspnetcore
            path: $(Build.ArtifactStagingDirectory)/bcs/BuildArtifacts_windows_x86_Release_aspnetcore
          - name: BuildArtifacts_windows_arm64_Release_aspnetcore
            path: $(Build.ArtifactStagingDirectory)/bcs/BuildArtifacts_windows_arm64_Release_aspnetcore
          - name: Windows_perf_build_Logs_Attempt_$(System.JobAttempt)
            path: artifacts/log/
            publishOnError: true
            includeForks: true

      # =====================================================================
      # Linux x64 build job
      # =====================================================================
      - template: .azure/pipelines/jobs/default-build.yml@self
        parameters:
          jobName: Linux_x64_build
          jobDisplayName: 'Build: Linux x64 (perf-build)'
          agentOs: Linux
          use1ESUbuntu: true
          installNodeJs: false
          buildArgs:
            --arch x64
            --pack
            --all
            --no-build-java
            -p:OnlyPackPlatformSpecificPackages=true
            $(_BuildArgs)
            $(_InternalRuntimeDownloadArgs)
          afterBuild:
          - pwsh: |
              $ErrorActionPreference = 'Stop'

              $shippingDir = Join-Path $env:BUILD_SOURCESDIRECTORY 'artifacts/packages/Release/Shipping'
              $stagingRoot = Join-Path $env:BUILD_ARTIFACTSTAGINGDIRECTORY 'bcs'

              $rid  = 'linux-x64'
              $os   = 'linux'
              $arch = 'x64'
              $configKey = "aspnetcore_${arch}_${os}"
              $artifactName = "BuildArtifacts_${os}_${arch}_Release_aspnetcore"
              $archiveFile = "${artifactName}.tar.gz"

              Write-Host "=== Packing $configKey (rid=$rid) ==="

              $pattern = "Microsoft.AspNetCore.App.Runtime.$rid.*.nupkg"
              $nupkg = Get-ChildItem -Path $shippingDir -Filter $pattern -File -ErrorAction SilentlyContinue |
                       Where-Object { $_.Name -notmatch '\.symbols\.nupkg$' } |
                       Sort-Object Name |
                       Select-Object -First 1
              if (-not $nupkg) {
                  throw "Could not find runtime pack nupkg matching '$pattern' under '$shippingDir'."
              }
              Write-Host "Found nupkg: $($nupkg.FullName)"

              $stageDir   = Join-Path $stagingRoot $artifactName
              $payloadDir = Join-Path $stageDir "microsoft.aspnetcore.app.runtime.$rid"
              $releaseDir = Join-Path $payloadDir 'Release'
              New-Item -ItemType Directory -Force -Path $releaseDir | Out-Null

              # `unzip` is present on the 1ES Ubuntu agents.
              & unzip -q $nupkg.FullName -d $releaseDir
              if ($LASTEXITCODE -ne 0) { throw "unzip of '$($nupkg.FullName)' failed (exit $LASTEXITCODE)." }

              $runtimesDir = Join-Path $releaseDir "runtimes/$rid"
              if (-not (Test-Path $runtimesDir)) {
                  throw "Extracted runtime pack is missing expected directory '$runtimesDir'."
              }

              $libMatches = Get-ChildItem -Path (Join-Path $runtimesDir 'lib') -Recurse -Filter 'Microsoft.AspNetCore.*.dll' -ErrorAction SilentlyContinue
              if (-not $libMatches -or $libMatches.Count -eq 0) {
                  throw "Extracted runtime pack for $rid is missing managed Microsoft.AspNetCore.*.dll under 'runtimes/$rid/lib'."
              }
              Write-Host "Validated managed lib dir contains $($libMatches.Count) Microsoft.AspNetCore.*.dll(s)."

              Get-ChildItem -Path $runtimesDir -Recurse -Include '*.pdb','*.dbg' -ErrorAction SilentlyContinue |
                  ForEach-Object { Remove-Item -LiteralPath $_.FullName -Force }

              $archivePath = Join-Path $stageDir $archiveFile
              if (Test-Path $archivePath) { Remove-Item -LiteralPath $archivePath -Force }
              # Tar the lowercase root directory so the archive contents start with
              # `microsoft.aspnetcore.app.runtime.{rid}/...`.
              & tar -czf $archivePath -C $stageDir "microsoft.aspnetcore.app.runtime.$rid"
              if ($LASTEXITCODE -ne 0) { throw "tar of '$payloadDir' failed (exit $LASTEXITCODE)." }

              # Assert the archive root matches the load-bearing contract.
              $expectedRoot = "microsoft.aspnetcore.app.runtime.$rid/"
              $firstEntry = (& tar -tzf $archivePath | Select-Object -First 1)
              if (-not $firstEntry.StartsWith($expectedRoot)) {
                  throw "Archive '$archivePath' first entry '$firstEntry' does not start with '$expectedRoot' (load-bearing contract for future crank PR)."
              }

              # Drop the working payload directory so only the archive ends up in the published pipeline artifact.
              Remove-Item -LiteralPath $payloadDir -Recurse -Force

              $size = (Get-Item $archivePath).Length
              Write-Host "Produced archive: $archivePath ($size bytes)"
            displayName: 'Pack BCS archive (linux-x64)'

          artifacts:
          - name: BuildArtifacts_linux_x64_Release_aspnetcore
            path: $(Build.ArtifactStagingDirectory)/bcs/BuildArtifacts_linux_x64_Release_aspnetcore
          - name: Linux_x64_perf_build_Logs_Attempt_$(System.JobAttempt)
            path: artifacts/log/
            publishOnError: true
            includeForks: true

      # =====================================================================
      # Linux arm64 build job (cross-build from x64 host)
      # =====================================================================
      - template: .azure/pipelines/jobs/default-build.yml@self
        parameters:
          jobName: Linux_arm64_build
          jobDisplayName: 'Build: Linux ARM64 (perf-build)'
          agentOs: Linux
          use1ESUbuntu: true
          installNodeJs: false
          buildArgs:
            --arch arm64
            --pack
            --all
            --no-build-java
            -p:OnlyPackPlatformSpecificPackages=true
            $(_BuildArgs)
            $(_InternalRuntimeDownloadArgs)
          afterBuild:
          - pwsh: |
              $ErrorActionPreference = 'Stop'

              $shippingDir = Join-Path $env:BUILD_SOURCESDIRECTORY 'artifacts/packages/Release/Shipping'
              $stagingRoot = Join-Path $env:BUILD_ARTIFACTSTAGINGDIRECTORY 'bcs'

              $rid  = 'linux-arm64'
              $os   = 'linux'
              $arch = 'arm64'
              $configKey = "aspnetcore_${arch}_${os}"
              $artifactName = "BuildArtifacts_${os}_${arch}_Release_aspnetcore"
              $archiveFile = "${artifactName}.tar.gz"

              Write-Host "=== Packing $configKey (rid=$rid) ==="

              $pattern = "Microsoft.AspNetCore.App.Runtime.$rid.*.nupkg"
              $nupkg = Get-ChildItem -Path $shippingDir -Filter $pattern -File -ErrorAction SilentlyContinue |
                       Where-Object { $_.Name -notmatch '\.symbols\.nupkg$' } |
                       Sort-Object Name |
                       Select-Object -First 1
              if (-not $nupkg) {
                  throw "Could not find runtime pack nupkg matching '$pattern' under '$shippingDir'."
              }
              Write-Host "Found nupkg: $($nupkg.FullName)"

              $stageDir   = Join-Path $stagingRoot $artifactName
              $payloadDir = Join-Path $stageDir "microsoft.aspnetcore.app.runtime.$rid"
              $releaseDir = Join-Path $payloadDir 'Release'
              New-Item -ItemType Directory -Force -Path $releaseDir | Out-Null

              & unzip -q $nupkg.FullName -d $releaseDir
              if ($LASTEXITCODE -ne 0) { throw "unzip of '$($nupkg.FullName)' failed (exit $LASTEXITCODE)." }

              $runtimesDir = Join-Path $releaseDir "runtimes/$rid"
              if (-not (Test-Path $runtimesDir)) {
                  throw "Extracted runtime pack is missing expected directory '$runtimesDir'."
              }

              $libMatches = Get-ChildItem -Path (Join-Path $runtimesDir 'lib') -Recurse -Filter 'Microsoft.AspNetCore.*.dll' -ErrorAction SilentlyContinue
              if (-not $libMatches -or $libMatches.Count -eq 0) {
                  throw "Extracted runtime pack for $rid is missing managed Microsoft.AspNetCore.*.dll under 'runtimes/$rid/lib'."
              }
              Write-Host "Validated managed lib dir contains $($libMatches.Count) Microsoft.AspNetCore.*.dll(s)."

              Get-ChildItem -Path $runtimesDir -Recurse -Include '*.pdb','*.dbg' -ErrorAction SilentlyContinue |
                  ForEach-Object { Remove-Item -LiteralPath $_.FullName -Force }

              $archivePath = Join-Path $stageDir $archiveFile
              if (Test-Path $archivePath) { Remove-Item -LiteralPath $archivePath -Force }
              & tar -czf $archivePath -C $stageDir "microsoft.aspnetcore.app.runtime.$rid"
              if ($LASTEXITCODE -ne 0) { throw "tar of '$payloadDir' failed (exit $LASTEXITCODE)." }

              # Assert the archive root matches the load-bearing contract.
              $expectedRoot = "microsoft.aspnetcore.app.runtime.$rid/"
              $firstEntry = (& tar -tzf $archivePath | Select-Object -First 1)
              if (-not $firstEntry.StartsWith($expectedRoot)) {
                  throw "Archive '$archivePath' first entry '$firstEntry' does not start with '$expectedRoot' (load-bearing contract for future crank PR)."
              }

              # Drop the working payload directory so only the archive ends up in the published pipeline artifact.
              Remove-Item -LiteralPath $payloadDir -Recurse -Force

              $size = (Get-Item $archivePath).Length
              Write-Host "Produced archive: $archivePath ($size bytes)"
            displayName: 'Pack BCS archive (linux-arm64)'

          artifacts:
          - name: BuildArtifacts_linux_arm64_Release_aspnetcore
            path: $(Build.ArtifactStagingDirectory)/bcs/BuildArtifacts_linux_arm64_Release_aspnetcore
          - name: Linux_arm64_perf_build_Logs_Attempt_$(System.JobAttempt)
            path: artifacts/log/
            publishOnError: true
            includeForks: true

    # ==========================================================================
    # UploadArtifacts stage
    #
    # Gated to internal + (IndividualCI | Manual). IndividualCI covers the
    # steady-state per-commit flow; Manual covers the runbook's "queue one
    # seed run" step (so a manually queued run actually uploads, instead of
    # silently producing a successful AzDO build with zero BCS payloads that
    # the MissingBuildsTrigger Function would later try to index).
    # `condition: succeeded()` then means any build job failure skips this
    # stage entirely, which makes the overall AzDO build report as
    # PartiallySucceeded and the Function skips indexing for this SHA
    # (whole-pipeline-indexing contract).
    # ==========================================================================
    - ${{ if and(ne(variables['System.TeamProject'], 'public'), or(eq(variables['Build.Reason'], 'IndividualCI'), eq(variables['Build.Reason'], 'Manual'))) }}:
      - stage: UploadArtifacts
        displayName: 'Upload Artifacts to BCS'
        dependsOn: build
        condition: succeeded()
        jobs:

        - template: .azure/pipelines/jobs/perf-build-upload-job.yml@self
          parameters:
            configKey: aspnetcore_x64_linux
            pipelineArtifactName: BuildArtifacts_linux_x64_Release_aspnetcore
            archiveFile: BuildArtifacts_linux_x64_Release_aspnetcore.tar.gz
            headRetryCount: ${{ parameters.headRetryCount }}
            headRetryDelaySeconds: ${{ parameters.headRetryDelaySeconds }}

        - template: .azure/pipelines/jobs/perf-build-upload-job.yml@self
          parameters:
            configKey: aspnetcore_arm64_linux
            pipelineArtifactName: BuildArtifacts_linux_arm64_Release_aspnetcore
            archiveFile: BuildArtifacts_linux_arm64_Release_aspnetcore.tar.gz
            headRetryCount: ${{ parameters.headRetryCount }}
            headRetryDelaySeconds: ${{ parameters.headRetryDelaySeconds }}

        - template: .azure/pipelines/jobs/perf-build-upload-job.yml@self
          parameters:
            configKey: aspnetcore_x64_windows
            pipelineArtifactName: BuildArtifacts_windows_x64_Release_aspnetcore
            archiveFile: BuildArtifacts_windows_x64_Release_aspnetcore.zip
            headRetryCount: ${{ parameters.headRetryCount }}
            headRetryDelaySeconds: ${{ parameters.headRetryDelaySeconds }}

        - template: .azure/pipelines/jobs/perf-build-upload-job.yml@self
          parameters:
            configKey: aspnetcore_arm64_windows
            pipelineArtifactName: BuildArtifacts_windows_arm64_Release_aspnetcore
            archiveFile: BuildArtifacts_windows_arm64_Release_aspnetcore.zip
            headRetryCount: ${{ parameters.headRetryCount }}
            headRetryDelaySeconds: ${{ parameters.headRetryDelaySeconds }}

        - template: .azure/pipelines/jobs/perf-build-upload-job.yml@self
          parameters:
            configKey: aspnetcore_x86_windows
            pipelineArtifactName: BuildArtifacts_windows_x86_Release_aspnetcore
            archiveFile: BuildArtifacts_windows_x86_Release_aspnetcore.zip
            headRetryCount: ${{ parameters.headRetryCount }}
            headRetryDelaySeconds: ${{ parameters.headRetryDelaySeconds }}
