# perf-build-upload-job.yml
#
# Per-config upload job for the ASP.NET Core perf-build pipeline.
# Atomicity unit for the Build Cache Service (BCS) — performs three
# operations in a single job, in this order:
#
#   1. az storage blob upload <archive>  ->  builds/aspnetcore/buildArtifacts/{sha}/{configKey}/{archiveFile}
#   2. HEAD-verify the static-website URL with a short retry loop
#      (mitigates the CDN visibility lag the dotnet/crank PR 878
#      live-testing surfaced — Azure Storage static-website endpoints
#      report uploaded blobs only after a short propagation delay).
#   3. Only if (2) succeeded: write {"buildId":"$(Build.BuildId)"} to
#      builds/aspnetcore/buildArtifacts/{sha}/{configKey}/buildInfo.json
#
# Atomicity rule (load-bearing): never write buildInfo.json before the
# matching archive is HEAD-verified. This ensures the MissingBuildsTrigger
# Azure Function never indexes a (sha, configKey) before its archive is
# GET-able from the crank consumer's perspective.
#
# Whole-pipeline indexing contract (MissingBuildsTrigger.cs:64): the
# Function only indexes Azure DevOps builds with overall
# Status == Succeeded. This job MUST run with continueOnError: false (the
# default) so that any single upload failure marks the overall build
# PartiallySucceeded and the Function skips indexing for that SHA
# entirely. Operator retries the whole build green.

parameters:
- name: configKey
  type: string
- name: pipelineArtifactName
  type: string
- name: archiveFile
  type: string
- name: headRetryCount
  type: number
  default: 6
- name: headRetryDelaySeconds
  type: number
  default: 10

jobs:
- job: Upload_${{ parameters.configKey }}
  displayName: 'Upload ${{ parameters.configKey }}'
  pool:
    name: $(DncEngInternalBuildPool)
    image: 1es-ubuntu-2204
    os: linux
  steps:
  - checkout: none

  - download: current
    displayName: 'Download pipeline artifact ${{ parameters.pipelineArtifactName }}'
    artifact: ${{ parameters.pipelineArtifactName }}

  - task: AzureCLI@2
    displayName: 'Upload archive, HEAD-verify, then write buildInfo.json'
    inputs:
      azureSubscription: $(_aspNetCoreBcsSubscription)
      scriptType: pscore
      scriptLocation: inlineScript
      inlineScript: |
        $ErrorActionPreference = 'Stop'

        $configKey   = '${{ parameters.configKey }}'
        $archiveFile = '${{ parameters.archiveFile }}'
        $artifactDir = '${{ parameters.pipelineArtifactName }}'
        $sha         = '$(Build.SourceVersion)'
        $maxAttempts = ${{ parameters.headRetryCount }}
        $delaySec    = ${{ parameters.headRetryDelaySeconds }}

        $blobBase     = "builds/$(_aspNetCoreBcsRepoName)/buildArtifacts/$sha/$configKey"
        $localArchive = "$(Pipeline.Workspace)/$artifactDir/$archiveFile"
        $publicUrl    = "$(_aspNetCoreBcsBaseUrl)/$blobBase/$archiveFile"

        if (-not (Test-Path $localArchive)) {
            throw "Expected downloaded archive at '$localArchive' but it does not exist."
        }

        Write-Host "=== Step 1/3: upload archive ==="
        Write-Host "Local : $localArchive"
        Write-Host "Remote: $blobBase/$archiveFile"
        az storage blob upload `
            --auth-mode login `
            --account-name '$(_aspNetCoreBcsAccountName)' `
            --container-name '$(_aspNetCoreBcsContainer)' `
            --file $localArchive `
            --name "$blobBase/$archiveFile" `
            --overwrite true
        if ($LASTEXITCODE -ne 0) {
            throw "az storage blob upload failed for archive '$archiveFile' (exit $LASTEXITCODE)."
        }

        Write-Host ""
        Write-Host "=== Step 2/3: HEAD-verify static-website URL ==="
        Write-Host "URL: $publicUrl"
        Write-Host "Up to $maxAttempts attempts, $delaySec seconds between attempts."
        $ok = $false
        for ($i = 1; $i -le $maxAttempts; $i++) {
            Write-Host ""
            Write-Host "Attempt $i / $maxAttempts ..."
            try {
                $resp = Invoke-WebRequest -Uri $publicUrl -Method Head -UseBasicParsing -TimeoutSec 30 -ErrorAction Stop
                Write-Host "HTTP $($resp.StatusCode)"
                if ($resp.StatusCode -eq 200) {
                    $ok = $true
                    break
                }
            } catch {
                Write-Host "Failed: $($_.Exception.Message)"
            }
            if ($i -lt $maxAttempts) {
                Start-Sleep -Seconds $delaySec
            }
        }
        if (-not $ok) {
            throw "HEAD-verify failed for '$publicUrl' after $maxAttempts attempts. NOT writing buildInfo.json (preserves atomicity invariant)."
        }
        Write-Host "HEAD-verify succeeded."

        Write-Host ""
        Write-Host "=== Step 3/3: write buildInfo.json ==="
        $buildInfo = '{"buildId":"$(Build.BuildId)"}'
        Write-Host "Remote: $blobBase/buildInfo.json"
        Write-Host "Body  : $buildInfo"
        az storage blob upload `
            --auth-mode login `
            --account-name '$(_aspNetCoreBcsAccountName)' `
            --container-name '$(_aspNetCoreBcsContainer)' `
            --data $buildInfo `
            --name "$blobBase/buildInfo.json" `
            --overwrite true
        if ($LASTEXITCODE -ne 0) {
            throw "az storage blob upload failed for buildInfo.json (exit $LASTEXITCODE)."
        }

        Write-Host ""
        Write-Host "Done. BCS now has both archive and buildInfo.json for sha=$sha configKey=$configKey."
